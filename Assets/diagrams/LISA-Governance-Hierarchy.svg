<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500">
  <defs>
    <linearGradient id="nistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5E8"/>
      <stop offset="100%" style="stop-color:#C9A8C9"/>
    </linearGradient>
    <linearGradient id="isoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D6EAF8"/>
      <stop offset="100%" style="stop-color:#AED6F1"/>
    </linearGradient>
    <linearGradient id="nisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FADBD8"/>
      <stop offset="100%" style="stop-color:#F5B7B1"/>
    </linearGradient>
    <linearGradient id="avgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D5F5E3"/>
      <stop offset="100%" style="stop-color:#ABEBC6"/>
    </linearGradient>
    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCF3CF"/>
      <stop offset="100%" style="stop-color:#F9E79F"/>
    </linearGradient>
    <linearGradient id="srGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3CD"/>
      <stop offset="100%" style="stop-color:#FFE69C"/>
    </linearGradient>
    <linearGradient id="cisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D1ECF1"/>
      <stop offset="100%" style="stop-color:#A8DADC"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowRealize" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888" fill-opacity="0.6"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="350" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">Governance Framework Hiërarchie</text>
  
  <!-- Level indicator -->
  <rect x="20" y="50" width="25" height="420" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="32" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle" transform="rotate(-90, 32, 260)">Abstractie niveau</text>
  <text x="32" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6c757d" text-anchor="middle">▲</text>
  <text x="32" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6c757d" text-anchor="middle">▼</text>
  
  <!-- NIST CSF - Top level -->
  <g filter="url(#shadow)">
    <rect x="250" y="55" width="200" height="60" rx="8" fill="url(#nistGrad)" stroke="#9B7B9B" stroke-width="2"/>
    <text x="350" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4A3A4A" text-anchor="middle" font-weight="700">NIST CSF</text>
    <text x="350" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6B4C6B" text-anchor="middle">Overkoepelend Raamwerk</text>
  </g>
  
  <!-- Arrows from NIST -->
  <line x1="300" y1="115" x2="180" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="115" x2="350" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="115" x2="520" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Level 2: ISO, NIS2, AVG -->
  <g filter="url(#shadow)">
    <rect x="80" y="155" width="160" height="55" rx="8" fill="url(#isoGrad)" stroke="#5DADE2" stroke-width="2"/>
    <text x="160" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1B4F72" text-anchor="middle" font-weight="700">ISO 27001:2022</text>
    <text x="160" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2874A6" text-anchor="middle">Internationale Standaard</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="270" y="155" width="160" height="55" rx="8" fill="url(#nisGrad)" stroke="#E74C3C" stroke-width="2"/>
    <text x="350" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7B241C" text-anchor="middle" font-weight="700">NIS2 Directive</text>
    <text x="350" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#943126" text-anchor="middle">EU Wetgeving 2022/2555</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="460" y="155" width="160" height="55" rx="8" fill="url(#avgGrad)" stroke="#27AE60" stroke-width="2"/>
    <text x="540" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#145A32" text-anchor="middle" font-weight="700">AVG / GDPR</text>
    <text x="540" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#196F3D" text-anchor="middle">Privacy Verordening</text>
  </g>
  
  <!-- Arrows to BIO -->
  <line x1="160" y1="210" x2="280" y2="250" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="210" x2="350" y2="250" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="210" x2="420" y2="250" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRealize)"/>
  
  <!-- BIO 2.0 -->
  <g filter="url(#shadow)">
    <rect x="225" y="255" width="250" height="55" rx="8" fill="url(#bioGrad)" stroke="#D4AC0D" stroke-width="2"/>
    <text x="350" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7D6608" text-anchor="middle" font-weight="700">BIO 2.0</text>
    <text x="350" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#9A7D0A" text-anchor="middle">Baseline Informatiebeveiliging Overheid</text>
  </g>
  
  <!-- Privacy integration note -->
  <text x="485" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#888" font-style="italic">Privacy geïntegreerd</text>
  
  <!-- Arrow to Security Requirements -->
  <line x1="350" y1="310" x2="350" y2="345" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Security Requirements -->
  <g filter="url(#shadow)">
    <rect x="150" y="350" width="400" height="55" rx="8" fill="url(#srGrad)" stroke="#D4A574" stroke-width="2"/>
    <text x="350" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5D4E37" text-anchor="middle" font-weight="700">Security Requirements (SR-1 t/m SR-13)</text>
    <text x="350" y="393" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8B6914" text-anchor="middle">Core Security Domains</text>
  </g>
  
  <!-- Arrow to Controls -->
  <line x1="350" y1="405" x2="350" y2="435" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- CIS Controls -->
  <g filter="url(#shadow)">
    <rect x="150" y="440" width="400" height="50" rx="8" fill="url(#cisGrad)" stroke="#5B9AA0" stroke-width="2"/>
    <text x="350" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1D4E53" text-anchor="middle" font-weight="700">CIS Controls v8 + Extended Privacy Controls</text>
    <text x="350" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2E6B70" text-anchor="middle">180 Tactische Maatregelen</text>
  </g>
  
  <!-- Legend -->
  <rect x="560" y="55" width="120" height="90" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="620" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle" font-weight="600">Legenda</text>
  
  <line x1="570" y1="88" x2="600" y2="88" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#495057">Afdwingend</text>
  
  <line x1="570" y1="108" x2="600" y2="108" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRealize)"/>
  <text x="610" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#495057">Informerend</text>
  
  <rect x="570" y="120" width="20" height="12" rx="2" fill="url(#nistGrad)" stroke="#9B7B9B" stroke-width="1"/>
  <text x="598" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#495057">Framework</text>
</svg>
