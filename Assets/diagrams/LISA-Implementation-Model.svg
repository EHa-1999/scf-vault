<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450">
  <defs>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D1ECF1"/>
      <stop offset="100%" style="stop-color:#A8DADC"/>
    </linearGradient>
    <linearGradient id="sysGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5E8"/>
      <stop offset="100%" style="stop-color:#D4B8D4"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4EDDA"/>
      <stop offset="100%" style="stop-color:#A8D5BA"/>
    </linearGradient>
    <linearGradient id="implGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3CD"/>
      <stop offset="100%" style="stop-color:#FFE69C"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="diamond" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <polygon points="6 0, 12 6, 6 12, 0 6" fill="none" stroke="#666" stroke-width="1"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="375" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">Implementation Relatie Model</text>
  
  <!-- Control -->
  <g filter="url(#shadow)">
    <rect x="280" y="55" width="180" height="70" rx="6" fill="url(#ctrlGrad)" stroke="#5B9AA0" stroke-width="2"/>
    <rect x="280" y="55" width="180" height="20" rx="6" fill="#5B9AA0"/>
    <rect x="280" y="69" width="180" height="6" fill="url(#ctrlGrad)"/>
    <text x="370" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="600">Control</text>
    <text x="370" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1D4E53" text-anchor="middle" font-weight="700">CIS-3.11</text>
    <text x="370" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2E6B70" text-anchor="middle">Encrypt Data at Rest</text>
  </g>
  
  <!-- 1:N arrow from Control to Implementation -->
  <line x1="370" y1="125" x2="370" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="385" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#666">1:N</text>
  
  <!-- Implementation (center) -->
  <g filter="url(#shadow)">
    <rect x="220" y="180" width="300" height="90" rx="6" fill="url(#implGrad)" stroke="#D4A574" stroke-width="2"/>
    <rect x="220" y="180" width="300" height="22" rx="6" fill="#D4A574"/>
    <rect x="220" y="196" width="300" height="6" fill="url(#implGrad)"/>
    <text x="370" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="600">Implementation</text>
    <text x="370" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5D4E37" text-anchor="middle" font-weight="700">IMPL-XENA-MinIO-3.11</text>
    <text x="370" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#7D6608" text-anchor="middle">Status: Implemented</text>
    <text x="370" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8B6914" text-anchor="middle" font-style="italic">SSE-KMS enabled, keys in OpenBAO, rotation 90d</text>
  </g>
  
  <!-- System (left) -->
  <g filter="url(#shadow)">
    <rect x="40" y="195" width="140" height="60" rx="6" fill="url(#sysGrad)" stroke="#9B7B9B" stroke-width="2"/>
    <rect x="40" y="195" width="140" height="18" rx="6" fill="#9B7B9B"/>
    <rect x="40" y="208" width="140" height="5" fill="url(#sysGrad)"/>
    <text x="110" y="209" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="600">System</text>
    <text x="110" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4A3A4A" text-anchor="middle" font-weight="700">XENA</text>
    <text x="110" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#6B4C6B" text-anchor="middle">Document Management</text>
  </g>
  
  <!-- Component (right) -->
  <g filter="url(#shadow)">
    <rect x="560" y="195" width="140" height="60" rx="6" fill="url(#compGrad)" stroke="#5A9A6A" stroke-width="2"/>
    <rect x="560" y="195" width="140" height="18" rx="6" fill="#5A9A6A"/>
    <rect x="560" y="208" width="140" height="5" fill="url(#compGrad)"/>
    <text x="630" y="209" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="600">Component</text>
    <text x="630" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1D4E2D" text-anchor="middle" font-weight="700">MinIO</text>
    <text x="630" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#2E6B3E" text-anchor="middle">S3 Object Storage</text>
  </g>
  
  <!-- Arrows to System and Component -->
  <line x1="220" y1="225" x2="180" y2="225" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#666">N:1</text>
  
  <line x1="520" y1="225" x2="560" y2="225" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="535" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#666">N:1</text>
  
  <!-- Evidence & Risk (bottom) -->
  <line x1="320" y1="270" x2="250" y2="320" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="270" x2="490" y2="320" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Evidence -->
  <g filter="url(#shadow)">
    <rect x="130" y="325" width="180" height="55" rx="6" fill="#E8F4F6" stroke="#5B9AA0" stroke-width="1.5"/>
    <text x="220" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1D4E53" text-anchor="middle" font-weight="600">Evidence</text>
    <text x="220" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2E6B70" text-anchor="middle">Config export, test reports</text>
  </g>
  
  <!-- Risk -->
  <g filter="url(#shadow)">
    <rect x="430" y="325" width="180" height="55" rx="6" fill="#FADBD8" stroke="#E74C3C" stroke-width="1.5"/>
    <text x="520" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7B241C" text-anchor="middle" font-weight="600">Risk Mitigation</text>
    <text x="520" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#943126" text-anchor="middle">RSK-001: Data breach</text>
  </g>
  
  <!-- Legend -->
  <rect x="30" y="400" width="690" height="40" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="55" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#495057" font-weight="600">Legenda:</text>
  
  <rect x="110" y="410" width="20" height="12" rx="2" fill="url(#ctrlGrad)" stroke="#5B9AA0"/>
  <text x="138" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#495057">Control</text>
  
  <rect x="200" y="410" width="20" height="12" rx="2" fill="url(#implGrad)" stroke="#D4A574"/>
  <text x="228" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#495057">Implementation</text>
  
  <rect x="320" y="410" width="20" height="12" rx="2" fill="url(#sysGrad)" stroke="#9B7B9B"/>
  <text x="348" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#495057">System</text>
  
  <rect x="410" y="410" width="20" height="12" rx="2" fill="url(#compGrad)" stroke="#5A9A6A"/>
  <text x="438" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#495057">Component</text>
  
  <text x="530" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#495057">1:N = één-op-veel relatie</text>
  <text x="650" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#495057">N:1 = veel-op-één relatie</text>
</svg>
