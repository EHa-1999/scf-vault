<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <linearGradient id="riskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FADBD8"/>
      <stop offset="100%" style="stop-color:#F5B7B1"/>
    </linearGradient>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D1ECF1"/>
      <stop offset="100%" style="stop-color:#A8DADC"/>
    </linearGradient>
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8"/>
      <stop offset="100%" style="stop-color:#D0D0D0"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBoth" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="350" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#2C3E50" text-anchor="middle">Risico-Control Mapping (N:M Relatie)</text>
  
  <!-- Main Risk Box -->
  <g filter="url(#shadow)">
    <rect x="50" y="60" width="200" height="100" rx="8" fill="url(#riskGrad)" stroke="#E74C3C" stroke-width="2"/>
    <rect x="50" y="60" width="200" height="24" rx="8" fill="#E74C3C"/>
    <rect x="50" y="78" width="200" height="6" fill="url(#riskGrad)"/>
    <text x="150" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Risk</text>
    <text x="150" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7B241C" text-anchor="middle" font-weight="700">RSK-001</text>
    <text x="150" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#943126" text-anchor="middle">Data breach via</text>
    <text x="150" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#943126" text-anchor="middle">unencrypted data</text>
  </g>
  
  <!-- Main Control Box -->
  <g filter="url(#shadow)">
    <rect x="450" y="60" width="200" height="100" rx="8" fill="url(#ctrlGrad)" stroke="#5B9AA0" stroke-width="2"/>
    <rect x="450" y="60" width="200" height="24" rx="8" fill="#5B9AA0"/>
    <rect x="450" y="78" width="200" height="6" fill="url(#ctrlGrad)"/>
    <text x="550" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">Control</text>
    <text x="550" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1D4E53" text-anchor="middle" font-weight="700">CIS-3.11</text>
    <text x="550" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2E6B70" text-anchor="middle">Encrypt Sensitive</text>
    <text x="550" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2E6B70" text-anchor="middle">Data at Rest</text>
  </g>
  
  <!-- N:M Connection -->
  <line x1="250" y1="110" x2="450" y2="110" stroke="#666" stroke-width="2" marker-start="url(#arrowBoth)" marker-end="url(#arrowBoth)"/>
  <rect x="310" y="95" width="80" height="30" rx="4" fill="white" stroke="#666" stroke-width="1"/>
  <text x="350" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="600">N : M</text>
  
  <!-- Additional Controls (linked to Risk) -->
  <g filter="url(#shadow)">
    <rect x="50" y="200" width="150" height="70" rx="6" fill="url(#ctrlGrad)" stroke="#5B9AA0" stroke-width="1.5"/>
    <rect x="50" y="200" width="150" height="20" rx="6" fill="#5B9AA0"/>
    <rect x="50" y="215" width="150" height="5" fill="url(#ctrlGrad)"/>
    <text x="125" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="600">Andere Controls</text>
    <text x="125" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1D4E53" text-anchor="middle">CIS-3.10</text>
    <text x="125" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1D4E53" text-anchor="middle">CIS-6.5</text>
  </g>
  
  <!-- Additional Risks (linked to Control) -->
  <g filter="url(#shadow)">
    <rect x="500" y="200" width="150" height="70" rx="6" fill="url(#riskGrad)" stroke="#E74C3C" stroke-width="1.5"/>
    <rect x="500" y="200" width="150" height="20" rx="6" fill="#E74C3C"/>
    <rect x="500" y="215" width="150" height="5" fill="url(#riskGrad)"/>
    <text x="575" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="600">Andere Risico's</text>
    <text x="575" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#7B241C" text-anchor="middle">RSK-002</text>
    <text x="575" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#7B241C" text-anchor="middle">RSK-003</text>
  </g>
  
  <!-- Arrows from Risk to other Controls -->
  <line x1="150" y1="160" x2="125" y2="200" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Arrows from Control to other Risks -->
  <line x1="550" y1="160" x2="575" y2="200" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Legend -->
  <rect x="180" y="300" width="340" height="65" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="350" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle" font-weight="600">Bidirectionele Traceerbaarheid</text>
  <text x="350" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6c757d" text-anchor="middle">Risico → Welke controls mitigeren dit risico?</text>
  <text x="350" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6c757d" text-anchor="middle">Control → Welke risico's worden hierdoor gemitigeerd?</text>
</svg>
