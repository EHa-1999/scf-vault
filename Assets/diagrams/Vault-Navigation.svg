<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="bold" fill="#1a365d">SCF-Vault Navigatie</text>
  
  <!-- Central Hub: README -->
  <g filter="url(#shadow)">
    <circle cx="400" cy="200" r="45" fill="#1a365d"/>
    <text x="400" y="195" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="white">🏠</text>
    <text x="400" y="212" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#bee3f8">README</text>
  </g>
  
  <!-- Connecting lines -->
  <line x1="355" y1="200" x2="180" y2="100" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="355" y1="200" x2="180" y2="200" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="355" y1="200" x2="180" y2="300" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="445" y1="200" x2="620" y2="100" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="445" y1="200" x2="620" y2="200" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="445" y1="200" x2="620" y2="300" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="400" y1="155" x2="400" y2="80" stroke="#cbd5e0" stroke-width="2"/>
  <line x1="400" y1="245" x2="400" y2="320" stroke="#cbd5e0" stroke-width="2"/>
  
  <!-- Left Column: Content -->
  
  <!-- Frameworks -->
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="120" height="55" rx="8" fill="#2c5282"/>
    <text x="140" y="92" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">🏛️ Frameworks</text>
    <text x="140" y="108" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#bee3f8">Governance</text>
    <text x="140" y="120" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#90cdf4">6 frameworks + LISA</text>
  </g>
  
  <!-- Controls -->
  <g filter="url(#shadow)">
    <rect x="80" y="170" width="120" height="55" rx="8" fill="#276749"/>
    <text x="140" y="192" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">📋 Controls</text>
    <text x="140" y="208" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#c6f6d5">CIS + Privacy</text>
    <text x="140" y="220" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#9ae6b4">180 controls</text>
  </g>
  
  <!-- Systems & Components -->
  <g filter="url(#shadow)">
    <rect x="80" y="270" width="120" height="55" rx="8" fill="#744210"/>
    <text x="140" y="292" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">🖥️ Systems</text>
    <text x="140" y="308" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#feebc8">+ Components</text>
    <text x="140" y="320" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#fbd38d">XENA, ZGW, ...</text>
  </g>
  
  <!-- Right Column: Operations -->
  
  <!-- Dashboards -->
  <g filter="url(#shadow)">
    <rect x="600" y="70" width="120" height="55" rx="8" fill="#553c9a"/>
    <text x="660" y="92" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">📊 Dashboards</text>
    <text x="660" y="108" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#e9d8fd">Monitoring</text>
    <text x="660" y="120" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#d6bcfa">7 dashboards</text>
  </g>
  
  <!-- Implementations -->
  <g filter="url(#shadow)">
    <rect x="600" y="170" width="120" height="55" rx="8" fill="#2b6cb0"/>
    <text x="660" y="192" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">⚙️ Implement.</text>
    <text x="660" y="208" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#bee3f8">Control → Tech</text>
    <text x="660" y="220" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#90cdf4">Per component</text>
  </g>
  
  <!-- Audits & Risks -->
  <g filter="url(#shadow)">
    <rect x="600" y="270" width="120" height="55" rx="8" fill="#9b2c2c"/>
    <text x="660" y="292" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">🔍 Audits</text>
    <text x="660" y="308" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#fed7d7">+ Risks</text>
    <text x="660" y="320" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#feb2b2">Assurance</text>
  </g>
  
  <!-- Top: Documentatie -->
  <g filter="url(#shadow)">
    <rect x="330" y="50" width="140" height="45" rx="8" fill="#2d3748"/>
    <text x="400" y="72" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">📚 Documentatie</text>
    <text x="400" y="88" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#e2e8f0">Handleidingen</text>
  </g>
  
  <!-- Bottom: Templates & Planning -->
  <g filter="url(#shadow)">
    <rect x="280" y="330" width="100" height="45" rx="8" fill="#4a5568"/>
    <text x="330" y="352" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="white">📝 Templates</text>
    <text x="330" y="368" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#e2e8f0">6 templates</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="420" y="330" width="100" height="45" rx="8" fill="#4a5568"/>
    <text x="470" y="352" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="white">📅 Planning</text>
    <text x="470" y="368" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#e2e8f0">Roadmaps</text>
  </g>
  
  <!-- Legend -->
  <rect x="20" y="360" width="180" height="35" rx="4" fill="white" stroke="#e2e8f0"/>
  <text x="30" y="378" font-family="Segoe UI, Arial" font-size="8" fill="#718096">Klik op een sectie-link hieronder</text>
  <text x="30" y="390" font-family="Segoe UI, Arial" font-size="8" fill="#718096">om te navigeren →</text>
</svg>