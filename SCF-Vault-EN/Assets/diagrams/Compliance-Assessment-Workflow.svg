<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <!-- Validated state gradient (green) -->
    <linearGradient id="validGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B5E6B5"/>
      <stop offset="100%" style="stop-color:#90D090"/>
    </linearGradient>
    <!-- Assessment gradient (orange) -->
    <linearGradient id="assessGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE0B5"/>
      <stop offset="100%" style="stop-color:#F5D090"/>
    </linearGradient>
    <!-- Compliance Result gradient (blue) -->
    <linearGradient id="resultGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B5D5F5"/>
      <stop offset="100%" style="stop-color:#90C0E8"/>
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Compliance Assessment Workflow</text>
  
  <!-- VALIDATED Box (from Implementation) -->
  <rect x="20" y="50" width="180" height="120" rx="8" fill="url(#validGrad)" stroke="#70A070" stroke-width="2"/>
  <text x="110" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">✅ VALIDATED</text>
  <line x1="30" y1="85" x2="190" y2="85" stroke="#70A070" stroke-width="1"/>
  <text x="110" y="102" text-anchor="middle" font-size="10" fill="#555">(Implementation)</text>
  <text x="110" y="125" text-anchor="middle" font-size="10" fill="#555">impl_status =</text>
  <text x="110" y="140" text-anchor="middle" font-size="10" fill="#555">"validated"</text>
  <text x="110" y="160" text-anchor="middle" font-size="9" fill="#777">Technically verified</text>
  
  <!-- Arrow 1 -->
  <line x1="200" y1="110" x2="248" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- ASSESSMENT Box -->
  <rect x="250" y="50" width="180" height="120" rx="8" fill="url(#assessGrad)" stroke="#C0A060" stroke-width="2"/>
  <text x="340" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">🔍 ASSESSMENT</text>
  <line x1="260" y1="85" x2="420" y2="85" stroke="#C0A060" stroke-width="1"/>
  <text x="340" y="105" text-anchor="middle" font-size="10" fill="#555">• Self-assessment</text>
  <text x="340" y="120" text-anchor="middle" font-size="10" fill="#555">• Internal audit</text>
  <text x="340" y="135" text-anchor="middle" font-size="10" fill="#555">• External audit</text>
  <text x="340" y="160" text-anchor="middle" font-size="9" fill="#777">Collect evidence</text>
  
  <!-- Arrow 2 -->
  <line x1="430" y1="110" x2="478" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- COMPLIANCE STATUS Box -->
  <rect x="480" y="50" width="200" height="120" rx="8" fill="url(#resultGrad)" stroke="#6090C0" stroke-width="2"/>
  <text x="580" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">📋 COMPLIANCE STATUS</text>
  <line x1="490" y1="85" x2="670" y2="85" stroke="#6090C0" stroke-width="1"/>
  <text x="580" y="105" text-anchor="middle" font-size="10" fill="#555">🟢 compliant (80-100%)</text>
  <text x="580" y="122" text-anchor="middle" font-size="10" fill="#555">🟡 partial (31-79%)</text>
  <text x="580" y="139" text-anchor="middle" font-size="10" fill="#555">🔴 non_compliant (0-30%)</text>
  <text x="580" y="160" text-anchor="middle" font-size="9" fill="#777">compliance_score: 0-100</text>
</svg>
