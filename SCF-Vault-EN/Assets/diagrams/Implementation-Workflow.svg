<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <!-- ArchiMate Business Process gradient -->
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFB5"/>
      <stop offset="100%" style="stop-color:#F5F5A0"/>
    </linearGradient>
    <!-- Validated state gradient (green) -->
    <linearGradient id="validatedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B5E6B5"/>
      <stop offset="100%" style="stop-color:#90D090"/>
    </linearGradient>
    <!-- Compliance gradient (blue) -->
    <linearGradient id="complianceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B5D5F5"/>
      <stop offset="100%" style="stop-color:#90C0E8"/>
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Implementation Workflow</text>
  
  <!-- PLANNED Box -->
  <rect x="20" y="50" width="160" height="100" rx="8" fill="url(#processGrad)" stroke="#C0C080" stroke-width="2"/>
  <text x="100" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">🔴 PLANNED</text>
  <line x1="30" y1="85" x2="170" y2="85" stroke="#C0C080" stroke-width="1"/>
  <text x="100" y="105" text-anchor="middle" font-size="10" fill="#666">impl_status = "planned"</text>
  <text x="100" y="120" text-anchor="middle" font-size="10" fill="#666">impl_percentage: 0%</text>
  <text x="100" y="135" text-anchor="middle" font-size="10" fill="#666">validated: false</text>
  
  <!-- Arrow 1 -->
  <line x1="180" y1="100" x2="218" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- IN PROGRESS Box -->
  <rect x="220" y="50" width="160" height="100" rx="8" fill="url(#processGrad)" stroke="#C0C080" stroke-width="2"/>
  <text x="300" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">🟡 IN PROGRESS</text>
  <line x1="230" y1="85" x2="370" y2="85" stroke="#C0C080" stroke-width="1"/>
  <text x="300" y="105" text-anchor="middle" font-size="10" fill="#666">impl_status = "in_progress"</text>
  <text x="300" y="120" text-anchor="middle" font-size="10" fill="#666">impl_percentage: 1-99%</text>
  <text x="300" y="135" text-anchor="middle" font-size="10" fill="#666">validated: false</text>
  
  <!-- Arrow 2 -->
  <line x1="380" y1="100" x2="418" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- COMPLETED Box -->
  <rect x="420" y="50" width="160" height="100" rx="8" fill="url(#processGrad)" stroke="#C0C080" stroke-width="2"/>
  <text x="500" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">🟢 COMPLETED</text>
  <line x1="430" y1="85" x2="570" y2="85" stroke="#C0C080" stroke-width="1"/>
  <text x="500" y="105" text-anchor="middle" font-size="10" fill="#666">impl_status = "completed"</text>
  <text x="500" y="120" text-anchor="middle" font-size="10" fill="#666">impl_percentage: 100%</text>
  <text x="500" y="135" text-anchor="middle" font-size="10" fill="#666">validated: false</text>
  
  <!-- Arrow 3 -->
  <line x1="580" y1="100" x2="618" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- VALIDATED Box (Green) -->
  <rect x="620" y="50" width="160" height="100" rx="8" fill="url(#validatedGrad)" stroke="#70A070" stroke-width="2"/>
  <text x="700" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">✅ VALIDATED</text>
  <line x1="630" y1="85" x2="770" y2="85" stroke="#70A070" stroke-width="1"/>
  <text x="700" y="105" text-anchor="middle" font-size="10" fill="#555">impl_status = "validated"</text>
  <text x="700" y="120" text-anchor="middle" font-size="10" fill="#555">impl_percentage: 100%</text>
  <text x="700" y="135" text-anchor="middle" font-size="10" fill="#555">validated: true</text>
  
  <!-- Arrow down to Compliance -->
  <line x1="700" y1="150" x2="700" y2="188" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- COMPLIANCE ASSESSMENT Box (Blue) -->
  <rect x="620" y="190" width="160" height="70" rx="8" fill="url(#complianceGrad)" stroke="#6090C0" stroke-width="2"/>
  <text x="700" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">📋 COMPLIANCE</text>
  <text x="700" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">ASSESSMENT</text>
  <text x="700" y="252" text-anchor="middle" font-size="9" fill="#555">→ See Compliance Dashboard</text>
  
  <!-- Legend -->
  <rect x="20" y="200" width="15" height="15" rx="2" fill="url(#processGrad)" stroke="#C0C080"/>
  <text x="40" y="212" font-size="10" fill="#666">Implementation phase</text>
  
  <rect x="20" y="220" width="15" height="15" rx="2" fill="url(#validatedGrad)" stroke="#70A070"/>
  <text x="40" y="232" font-size="10" fill="#666">Validated</text>
  
  <rect x="20" y="240" width="15" height="15" rx="2" fill="url(#complianceGrad)" stroke="#6090C0"/>
  <text x="40" y="252" font-size="10" fill="#666">Compliance process</text>
</svg>
