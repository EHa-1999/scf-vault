<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- ArchiMate style gradients -->
    <linearGradient id="govGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5E8"/>
      <stop offset="100%" style="stop-color:#D4B8D4"/>
    </linearGradient>
    <linearGradient id="srGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3CD"/>
      <stop offset="100%" style="stop-color:#FFE69C"/>
    </linearGradient>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D1ECF1"/>
      <stop offset="100%" style="stop-color:#A8DADC"/>
    </linearGradient>
    <linearGradient id="implGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4EDDA"/>
      <stop offset="100%" style="stop-color:#A8D5BA"/>
    </linearGradient>
    <linearGradient id="evidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C3E6CB"/>
      <stop offset="100%" style="stop-color:#8FBC8F"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#2C3E50" text-anchor="middle">LISA - Layered Information Security Architecture</text>
  
  <!-- Layer 1: Governance Frameworks -->
  <g filter="url(#shadow)">
    <rect x="50" y="60" width="700" height="85" rx="8" fill="url(#govGrad)" stroke="#9B7B9B" stroke-width="1.5"/>
    <text x="70" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6B4C6B" font-weight="600">LAAG 1</text>
    <text x="70" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4A3A4A" font-weight="700">Governance Frameworks</text>
    <text x="740" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6B4C6B" text-anchor="end" font-style="italic">Strategisch</text>
    
    <!-- Framework boxes -->
    <rect x="70" y="108" width="90" height="28" rx="4" fill="#F8F0F8" stroke="#9B7B9B" stroke-width="1"/>
    <text x="115" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4A3A4A" text-anchor="middle">NIST CSF</text>
    
    <rect x="170" y="108" width="90" height="28" rx="4" fill="#F8F0F8" stroke="#9B7B9B" stroke-width="1"/>
    <text x="215" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4A3A4A" text-anchor="middle">ISO 27001</text>
    
    <rect x="270" y="108" width="90" height="28" rx="4" fill="#F8F0F8" stroke="#9B7B9B" stroke-width="1"/>
    <text x="315" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4A3A4A" text-anchor="middle">NIS2</text>
    
    <rect x="370" y="108" width="90" height="28" rx="4" fill="#F8F0F8" stroke="#9B7B9B" stroke-width="1"/>
    <text x="415" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4A3A4A" text-anchor="middle">BIO2</text>
    
    <rect x="470" y="108" width="90" height="28" rx="4" fill="#F8F0F8" stroke="#9B7B9B" stroke-width="1"/>
    <text x="515" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4A3A4A" text-anchor="middle">AVG/GDPR</text>
    
    <rect x="570" y="108" width="90" height="28" rx="4" fill="#F8F0F8" stroke="#9B7B9B" stroke-width="1"/>
    <text x="615" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4A3A4A" text-anchor="middle">CIS v8</text>
  </g>
  
  <!-- Arrow 1->2 -->
  <line x1="400" y1="145" x2="400" y2="163" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Layer 2: Security Requirements -->
  <g filter="url(#shadow)">
    <rect x="50" y="170" width="700" height="85" rx="8" fill="url(#srGrad)" stroke="#D4A574" stroke-width="1.5"/>
    <text x="70" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8B6914" font-weight="600">LAAG 2</text>
    <text x="70" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5D4E37" font-weight="700">Security Requirements</text>
    <text x="740" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8B6914" text-anchor="end" font-style="italic">Domein</text>
    
    <!-- SR boxes -->
    <rect x="70" y="218" width="55" height="28" rx="4" fill="#FFFBF0" stroke="#D4A574" stroke-width="1"/>
    <text x="97" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5D4E37" text-anchor="middle">SR-1</text>
    
    <rect x="130" y="218" width="55" height="28" rx="4" fill="#FFFBF0" stroke="#D4A574" stroke-width="1"/>
    <text x="157" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5D4E37" text-anchor="middle">SR-2</text>
    
    <rect x="190" y="218" width="55" height="28" rx="4" fill="#FFFBF0" stroke="#D4A574" stroke-width="1"/>
    <text x="217" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5D4E37" text-anchor="middle">SR-3</text>
    
    <rect x="250" y="218" width="55" height="28" rx="4" fill="#FFFBF0" stroke="#D4A574" stroke-width="1"/>
    <text x="277" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5D4E37" text-anchor="middle">SR-4</text>
    
    <rect x="310" y="218" width="55" height="28" rx="4" fill="#FFFBF0" stroke="#D4A574" stroke-width="1"/>
    <text x="337" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5D4E37" text-anchor="middle">SR-5</text>
    
    <rect x="370" y="218" width="55" height="28" rx="4" fill="#FFFBF0" stroke="#D4A574" stroke-width="1"/>
    <text x="397" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5D4E37" text-anchor="middle">SR-6</text>
    
    <rect x="430" y="218" width="55" height="28" rx="4" fill="#FFFBF0" stroke="#D4A574" stroke-width="1"/>
    <text x="457" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5D4E37" text-anchor="middle">SR-7</text>
    
    <rect x="490" y="218" width="55" height="28" rx="4" fill="#FFFBF0" stroke="#D4A574" stroke-width="1"/>
    <text x="517" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5D4E37" text-anchor="middle">SR-8</text>
    
    <rect x="550" y="218" width="55" height="28" rx="4" fill="#FFFBF0" stroke="#D4A574" stroke-width="1"/>
    <text x="577" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5D4E37" text-anchor="middle">SR-9</text>
    
    <rect x="610" y="218" width="55" height="28" rx="4" fill="#FFFBF0" stroke="#D4A574" stroke-width="1"/>
    <text x="637" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5D4E37" text-anchor="middle">SR-10</text>
    
    <rect x="670" y="218" width="70" height="28" rx="4" fill="#FFFBF0" stroke="#D4A574" stroke-width="1"/>
    <text x="705" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#5D4E37" text-anchor="middle">SR-11..13</text>
  </g>
  
  <!-- Arrow 2->3 -->
  <line x1="400" y1="255" x2="400" y2="273" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Layer 3: Controls -->
  <g filter="url(#shadow)">
    <rect x="50" y="280" width="700" height="85" rx="8" fill="url(#ctrlGrad)" stroke="#5B9AA0" stroke-width="1.5"/>
    <text x="70" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2E6B70" font-weight="600">LAAG 3</text>
    <text x="70" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1D4E53" font-weight="700">Controls</text>
    <text x="740" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2E6B70" text-anchor="end" font-style="italic">Tactisch</text>
    
    <!-- Control category boxes -->
    <rect x="70" y="328" width="300" height="28" rx="4" fill="#E8F4F6" stroke="#5B9AA0" stroke-width="1"/>
    <text x="220" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1D4E53" text-anchor="middle" font-weight="600">153 CIS Controls v8</text>
    
    <rect x="380" y="328" width="210" height="28" rx="4" fill="#E8F4F6" stroke="#5B9AA0" stroke-width="1"/>
    <text x="485" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1D4E53" text-anchor="middle" font-weight="600">27 Extended Privacy Controls</text>
    
    <rect x="600" y="328" width="135" height="28" rx="4" fill="#B8D8DC" stroke="#5B9AA0" stroke-width="1"/>
    <text x="667" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1D4E53" text-anchor="middle">180 Controls Total</text>
  </g>
  
  <!-- Arrow 3->4 -->
  <line x1="400" y1="365" x2="400" y2="383" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Layer 4: Implementation -->
  <g filter="url(#shadow)">
    <rect x="50" y="390" width="700" height="85" rx="8" fill="url(#implGrad)" stroke="#5A9A6A" stroke-width="1.5"/>
    <text x="70" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2E6B3E" font-weight="600">LAAG 4</text>
    <text x="70" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1D4E2D" font-weight="700">Implementaties</text>
    <text x="740" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2E6B3E" text-anchor="end" font-style="italic">Operationeel</text>
    
    <!-- Implementation boxes -->
    <rect x="70" y="438" width="140" height="28" rx="4" fill="#E8F4EA" stroke="#5A9A6A" stroke-width="1"/>
    <text x="140" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1D4E2D" text-anchor="middle" font-weight="600">Systems</text>
    
    <rect x="220" y="438" width="140" height="28" rx="4" fill="#E8F4EA" stroke="#5A9A6A" stroke-width="1"/>
    <text x="290" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1D4E2D" text-anchor="middle" font-weight="600">Components</text>
    
    <rect x="370" y="438" width="200" height="28" rx="4" fill="#E8F4EA" stroke="#5A9A6A" stroke-width="1"/>
    <text x="470" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1D4E2D" text-anchor="middle" font-weight="600">Implementations</text>
    
    <rect x="580" y="438" width="155" height="28" rx="4" fill="#C3E6CB" stroke="#5A9A6A" stroke-width="1"/>
    <text x="657" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1D4E2D" text-anchor="middle">Definition of Done</text>
  </g>
  
  <!-- Arrow 4->5 -->
  <line x1="400" y1="475" x2="400" y2="493" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Layer 5: Evidence & Risks -->
  <g filter="url(#shadow)">
    <rect x="50" y="500" width="700" height="75" rx="8" fill="url(#evidGrad)" stroke="#4A8A5A" stroke-width="1.5"/>
    <text x="70" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2E5B3E" font-weight="600">LAAG 5</text>
    <text x="70" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1D3E2D" font-weight="700">Evidence &amp; Risico's</text>
    <text x="740" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#2E5B3E" text-anchor="end" font-style="italic">Verificatie</text>
    
    <!-- Evidence boxes -->
    <rect x="70" y="548" width="180" height="22" rx="4" fill="#D4EDDA" stroke="#4A8A5A" stroke-width="1"/>
    <text x="160" y="563" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1D3E2D" text-anchor="middle">Bewijsmateriaal</text>
    
    <rect x="260" y="548" width="180" height="22" rx="4" fill="#D4EDDA" stroke="#4A8A5A" stroke-width="1"/>
    <text x="350" y="563" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1D3E2D" text-anchor="middle">Risico Register</text>
    
    <rect x="450" y="548" width="180" height="22" rx="4" fill="#D4EDDA" stroke="#4A8A5A" stroke-width="1"/>
    <text x="540" y="563" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1D3E2D" text-anchor="middle">Audit Trail</text>
  </g>
</svg>
