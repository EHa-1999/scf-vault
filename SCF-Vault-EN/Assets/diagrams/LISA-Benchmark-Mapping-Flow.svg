<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d6a4f"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e65100"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="bold" fill="#1a1a2e">CIS Benchmark Mapping Flow</text>
  <text x="450" y="50" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#666">Van technologie naar Implementation via Benchmark</text>
  
  <!-- Start: Component -->
  <g filter="url(#shadow)">
    <rect x="50" y="80" width="160" height="70" rx="8" fill="#e8f4ea" stroke="#2d6a4f" stroke-width="2"/>
    <text x="130" y="110" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#1a1a2e">Component</text>
    <text x="130" y="130" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#666">bijv. PostgreSQL 15</text>
  </g>
  
  <!-- Arrow to decision -->
  <line x1="210" y1="115" x2="270" y2="115" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Decision diamond: CIS Benchmark beschikbaar? -->
  <g filter="url(#shadow)">
    <polygon points="370,60 470,115 370,170 270,115" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="370" y="110" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#1a1a2e">CIS Benchmark</text>
    <text x="370" y="125" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#1a1a2e">beschikbaar?</text>
  </g>
  
  <!-- YES path -->
  <line x1="470" y1="115" x2="530" y2="115" stroke="#2d6a4f" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="500" y="105" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#2d6a4f">JA</text>
  
  <!-- CIS Benchmark box -->
  <g filter="url(#shadow)">
    <rect x="540" y="75" width="160" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="620" y="100" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#1a1a2e">CIS Benchmark</text>
    <text x="620" y="118" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#666">CIS PostgreSQL 15</text>
    <text x="620" y="133" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#666">Benchmark v1.0.0</text>
    <text x="620" y="148" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#1565c0">📥 cisecurity.org</text>
  </g>
  
  <!-- Arrow to Recommendations -->
  <line x1="700" y1="115" x2="750" y2="115" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Recommendations box -->
  <g filter="url(#shadow)">
    <rect x="760" y="70" width="120" height="90" rx="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1"/>
    <text x="820" y="92" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#1a1a2e">Recommendations</text>
    <text x="775" y="112" font-family="Segoe UI, Arial" font-size="8" fill="#666">4.2 Enable TDE</text>
    <text x="775" y="125" font-family="Segoe UI, Arial" font-size="8" fill="#666">6.1 Disable default</text>
    <text x="775" y="138" font-family="Segoe UI, Arial" font-size="8" fill="#666">3.1 Configure logs</text>
    <text x="775" y="151" font-family="Segoe UI, Arial" font-size="8" fill="#666">...</text>
  </g>
  
  <!-- NO path -->
  <line x1="370" y1="170" x2="370" y2="230" stroke="#e65100" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
  <text x="385" y="200" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#e65100">NEE</text>
  
  <!-- Extended Benchmark path -->
  <g filter="url(#shadow)">
    <rect x="280" y="240" width="180" height="90" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="370" y="265" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#1a1a2e">Extended Benchmark</text>
    <text x="370" y="285" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#666">Ontwikkel op basis van:</text>
    <text x="295" y="302" font-family="Segoe UI, Arial" font-size="8" fill="#666">• Vendor security guide</text>
    <text x="295" y="315" font-family="Segoe UI, Arial" font-size="8" fill="#666">• OWASP / NIST</text>
  </g>
  
  <!-- Extended benchmark document -->
  <line x1="460" y1="285" x2="530" y2="285" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrowhead-orange)"/>
  
  <g filter="url(#shadow)">
    <rect x="540" y="250" width="140" height="70" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
    <text x="610" y="275" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#1a1a2e">EXT-MinIO.md</text>
    <text x="610" y="295" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#666">Custom recommendations</text>
    <text x="610" y="310" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#666">met CIS mapping</text>
  </g>
  
  <!-- Both paths merge to CIS Control -->
  <line x1="820" y1="160" x2="820" y2="370" stroke="#666" stroke-width="1.5"/>
  <line x1="610" y1="320" x2="610" y2="370" stroke="#666" stroke-width="1.5"/>
  <line x1="610" y1="370" x2="820" y2="370" stroke="#666" stroke-width="1.5"/>
  <line x1="715" y1="370" x2="715" y2="400" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- CIS Control -->
  <g filter="url(#shadow)">
    <rect x="620" y="410" width="190" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="715" y="435" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#1a1a2e">CIS Control</text>
    <text x="715" y="455" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#666">CIS-3.11 Encrypt Data at Rest</text>
  </g>
  
  <!-- Arrow to Implementation -->
  <line x1="620" y1="440" x2="470" y2="440" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Implementation -->
  <g filter="url(#shadow)">
    <rect x="270" y="405" width="200" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="370" y="430" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#1a1a2e">Implementation</text>
    <text x="370" y="450" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#666">IMPL-XENA-PostgreSQL-3.11</text>
    <text x="370" y="465" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#888">DoD uit Benchmark 4.2</text>
  </g>
  
  <!-- Arrow back to Component -->
  <line x1="270" y1="440" x2="130" y2="440" stroke="#666" stroke-width="1.5"/>
  <line x1="130" y1="440" x2="130" y2="155" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="140" y="300" font-family="Segoe UI, Arial" font-size="9" fill="#666" transform="rotate(-90 140,300)">koppelt aan</text>
  
  <!-- Legend box -->
  <rect x="50" y="380" width="180" height="100" rx="6" fill="#f8f9fa" stroke="#e0e0e0"/>
  <text x="60" y="400" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#333">Bronnen voor DoD:</text>
  <rect x="60" y="410" width="12" height="12" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="80" y="420" font-family="Segoe UI, Arial" font-size="9" fill="#666">CIS Benchmark audit procedure</text>
  <rect x="60" y="430" width="12" height="12" fill="#fff3e0" stroke="#e65100"/>
  <text x="80" y="440" font-family="Segoe UI, Arial" font-size="9" fill="#666">Extended Benchmark custom</text>
  <rect x="60" y="450" width="12" height="12" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="80" y="460" font-family="Segoe UI, Arial" font-size="9" fill="#666">Vendor hardening guide</text>
  
  <!-- Key insight -->
  <rect x="50" y="195" width="160" height="35" rx="4" fill="#e8f4ea" stroke="#2d6a4f"/>
  <text x="130" y="212" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#2d6a4f">✓ PostgreSQL: CIS Benchmark</text>
  <text x="130" y="224" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#e65100">✗ MinIO: Extended Benchmark</text>
</svg>