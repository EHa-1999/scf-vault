<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="bold" fill="#1a1a2e">Control-Component-Implementation Relaties</text>
  <text x="450" y="50" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#666">Hoe Controls worden toegepast op Componenten via Implementations</text>
  
  <!-- System box (top level) -->
  <g filter="url(#shadow)">
    <rect x="350" y="70" width="200" height="60" rx="8" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="2"/>
    <text x="450" y="95" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="white">System</text>
    <text x="450" y="115" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#ccc">bijv. XENA</text>
  </g>
  
  <!-- Arrow from System to Components -->
  <line x1="450" y1="130" x2="450" y2="155" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="148" font-family="Segoe UI, Arial" font-size="9" fill="#666">bevat</text>
  
  <!-- Components row -->
  <g filter="url(#shadow)">
    <rect x="100" y="165" width="130" height="55" rx="6" fill="#e8f4ea" stroke="#2d6a4f" stroke-width="2"/>
    <text x="165" y="190" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#1a1a2e">Component</text>
    <text x="165" y="207" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#666">PostgreSQL</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="260" y="165" width="130" height="55" rx="6" fill="#e8f4ea" stroke="#2d6a4f" stroke-width="2"/>
    <text x="325" y="190" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#1a1a2e">Component</text>
    <text x="325" y="207" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#666">MinIO</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="420" y="165" width="130" height="55" rx="6" fill="#e8f4ea" stroke="#2d6a4f" stroke-width="2"/>
    <text x="485" y="190" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#1a1a2e">Component</text>
    <text x="485" y="207" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#666">KeyCloak</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="580" y="165" width="130" height="55" rx="6" fill="#e8f4ea" stroke="#2d6a4f" stroke-width="2"/>
    <text x="645" y="190" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#1a1a2e">Component</text>
    <text x="645" y="207" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#666">Apache NiFi</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="740" y="165" width="130" height="55" rx="6" fill="#e8f4ea" stroke="#2d6a4f" stroke-width="2"/>
    <text x="805" y="190" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#1a1a2e">Component</text>
    <text x="805" y="207" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" fill="#666">...</text>
  </g>
  
  <!-- SCB label -->
  <rect x="30" y="175" width="55" height="35" rx="4" fill="#2d6a4f"/>
  <text x="57" y="197" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="white">SCB</text>
  
  <!-- Implementation layer (the key!) -->
  <rect x="80" y="270" width="760" height="120" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="100" y="290" font-family="Segoe UI, Arial" font-size="12" font-weight="bold" fill="#f57f17">IMPLEMENTATION LAAG (de koppeltabel)</text>
  
  <!-- Implementation boxes -->
  <g filter="url(#shadow)">
    <rect x="100" y="305" width="150" height="70" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="175" y="325" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#1a1a2e">Implementation</text>
    <text x="175" y="342" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#666">IMPL-XENA-PG-3.11</text>
    <line x1="110" y1="350" x2="240" y2="350" stroke="#e0e0e0"/>
    <text x="175" y="365" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#888">control: CIS-3.11</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="280" y="305" width="150" height="70" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="355" y="325" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#1a1a2e">Implementation</text>
    <text x="355" y="342" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#666">IMPL-XENA-MinIO-3.6</text>
    <line x1="290" y1="350" x2="420" y2="350" stroke="#e0e0e0"/>
    <text x="355" y="365" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#888">control: CIS-3.6</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="460" y="305" width="150" height="70" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="535" y="325" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#1a1a2e">Implementation</text>
    <text x="535" y="342" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#666">IMPL-XENA-KC-6.5</text>
    <line x1="470" y1="350" x2="600" y2="350" stroke="#e0e0e0"/>
    <text x="535" y="365" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#888">control: CIS-6.5</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="640" y="305" width="150" height="70" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="715" y="325" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#1a1a2e">Implementation</text>
    <text x="715" y="342" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#666">IMPL-XENA-NiFi-8.2</text>
    <line x1="650" y1="350" x2="780" y2="350" stroke="#e0e0e0"/>
    <text x="715" y="365" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#888">control: CIS-8.2</text>
  </g>
  
  <!-- Arrows from Components to Implementations -->
  <line x1="165" y1="220" x2="165" y2="300" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="325" y1="220" x2="345" y2="300" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="485" y1="220" x2="525" y2="300" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="645" y1="220" x2="705" y2="300" stroke="#2d6a4f" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Controls row -->
  <g filter="url(#shadow)">
    <rect x="100" y="430" width="120" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="160" y="455" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#1a1a2e">CIS-3.11</text>
    <text x="160" y="470" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#666">Encrypt at Rest</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="260" y="430" width="120" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="320" y="455" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#1a1a2e">CIS-3.6</text>
    <text x="320" y="470" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#666">Encrypt Devices</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="420" y="430" width="120" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="480" y="455" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#1a1a2e">CIS-6.5</text>
    <text x="480" y="470" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#666">MFA Admin</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="580" y="430" width="120" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="640" y="455" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#1a1a2e">CIS-8.2</text>
    <text x="640" y="470" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#666">Audit Logs</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="740" y="430" width="120" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="800" y="455" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#1a1a2e">...</text>
    <text x="800" y="470" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#666">153 Controls</text>
  </g>
  
  <!-- Controls label -->
  <rect x="30" y="440" width="55" height="30" rx="4" fill="#1565c0"/>
  <text x="57" y="460" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="white">CIS</text>
  
  <!-- Arrows from Implementations to Controls -->
  <line x1="160" y1="375" x2="160" y2="425" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="340" y1="375" x2="320" y2="425" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="520" y1="375" x2="480" y2="425" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="700" y1="375" x2="640" y2="425" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  
  <!-- Legend -->
  <rect x="30" y="500" width="200" height="40" rx="4" fill="#f5f5f5" stroke="#e0e0e0"/>
  <text x="40" y="520" font-family="Segoe UI, Arial" font-size="9" font-weight="bold" fill="#333">Relatie:</text>
  <text x="40" y="532" font-family="Segoe UI, Arial" font-size="8" fill="#666">Control → Implementation → Component</text>
  
  <!-- Key insight box -->
  <rect x="580" y="500" width="280" height="40" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="720" y="515" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="bold" fill="#1565c0">💡 De Implementation is de koppeltabel!</text>
  <text x="720" y="530" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#666">Component kent Control niet direct</text>
</svg>