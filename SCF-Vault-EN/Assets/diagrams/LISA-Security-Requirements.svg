    <rect x="585" y="155" width="175" height="85" rx="6" fill="url(#srBaseGrad)" stroke="#D4A574" stroke-width="1.5"/>
    <rect x="585" y="155" width="175" height="22" rx="6" fill="#E8C87A"/>
    <rect x="585" y="171" width="175" height="6" fill="url(#srBaseGrad)"/>
    <text x="672" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5D4E37" text-anchor="middle" font-weight="700">SR-8</text>
    <text x="672" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5D4E37" text-anchor="middle" font-weight="600">Incident Response</text>
    <text x="672" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#7D6608" text-anchor="middle">& Recovery</text>
    <text x="672" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8B6914" text-anchor="middle" font-style="italic">DR, backup, IR</text>
  </g>
  
