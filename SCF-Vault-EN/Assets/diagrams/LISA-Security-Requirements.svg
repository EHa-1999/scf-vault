    <text x="117" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5D4E37" text-anchor="middle" font-weight="600">Secure Development</text>
    <text x="117" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#7D6608" text-anchor="middle">& Maintenance</text>
    <text x="117" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8B6914" text-anchor="middle" font-style="italic">SDLC, patching</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="215" y="155" width="175" height="85" rx="6" fill="url(#srBaseGrad)" stroke="#D4A574" stroke-width="1.5"/>
    <rect x="215" y="155" width="175" height="22" rx="6" fill="#E8C87A"/>
    <rect x="215" y="171" width="175" height="6" fill="url(#srBaseGrad)"/>
    <text x="302" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5D4E37" text-anchor="middle" font-weight="700">SR-6</text>
    <text x="302" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5D4E37" text-anchor="middle" font-weight="600">Security Monitoring</text>
    <text x="302" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#7D6608" text-anchor="middle">& Logging</text>
    <text x="302" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8B6914" text-anchor="middle" font-style="italic">Audit logs, alerting</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="400" y="155" width="175" height="85" rx="6" fill="url(#srBaseGrad)" stroke="#D4A574" stroke-width="1.5"/>
    <rect x="400" y="155" width="175" height="22" rx="6" fill="#E8C87A"/>
    <rect x="400" y="171" width="175" height="6" fill="url(#srBaseGrad)"/>
    <text x="487" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5D4E37" text-anchor="middle" font-weight="700">SR-7</text>
    <text x="487" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5D4E37" text-anchor="middle" font-weight="600">Network Security</text>
    <text x="487" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#7D6608" text-anchor="middle">& Segmentation</text>
    <text x="487" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8B6914" text-anchor="middle" font-style="italic">Firewall, IDS/IPS</text>
  </g>
  
