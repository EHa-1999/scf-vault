<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="srBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3CD"/>
      <stop offset="100%" style="stop-color:#FFE69C"/>
    </linearGradient>
    <linearGradient id="srPrivacyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D5F5E3"/>
      <stop offset="100%" style="stop-color:#ABEBC6"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">Security Requirements - 13 Domeinen</text>
  
  <!-- Row 1: SR-1 to SR-4 -->
  <g filter="url(#shadow)">
    <rect x="30" y="55" width="175" height="85" rx="6" fill="url(#srBaseGrad)" stroke="#D4A574" stroke-width="1.5"/>
    <rect x="30" y="55" width="175" height="22" rx="6" fill="#E8C87A"/>
    <rect x="30" y="71" width="175" height="6" fill="url(#srBaseGrad)"/>
    <text x="117" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5D4E37" text-anchor="middle" font-weight="700">SR-1</text>
    <text x="117" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5D4E37" text-anchor="middle" font-weight="600">Security Governance</text>
    <text x="117" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#7D6608" text-anchor="middle">Framework</text>
    <text x="117" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8B6914" text-anchor="middle" font-style="italic">Beleid, organisatie</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="215" y="55" width="175" height="85" rx="6" fill="url(#srBaseGrad)" stroke="#D4A574" stroke-width="1.5"/>
    <rect x="215" y="55" width="175" height="22" rx="6" fill="#E8C87A"/>
    <rect x="215" y="71" width="175" height="6" fill="url(#srBaseGrad)"/>
    <text x="302" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5D4E37" text-anchor="middle" font-weight="700">SR-2</text>
    <text x="302" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5D4E37" text-anchor="middle" font-weight="600">Risk Assessment</text>
    <text x="302" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#7D6608" text-anchor="middle">& Management</text>
    <text x="302" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8B6914" text-anchor="middle" font-style="italic">Risico-analyse</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="400" y="55" width="175" height="85" rx="6" fill="url(#srBaseGrad)" stroke="#D4A574" stroke-width="1.5"/>
    <rect x="400" y="55" width="175" height="22" rx="6" fill="#E8C87A"/>
    <rect x="400" y="71" width="175" height="6" fill="url(#srBaseGrad)"/>
    <text x="487" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5D4E37" text-anchor="middle" font-weight="700">SR-3</text>
    <text x="487" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5D4E37" text-anchor="middle" font-weight="600">Access Control</text>
    <text x="487" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#7D6608" text-anchor="middle">& Identity Management</text>
    <text x="487" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8B6914" text-anchor="middle" font-style="italic">Authenticatie, autorisatie</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="585" y="55" width="175" height="85" rx="6" fill="url(#srBaseGrad)" stroke="#D4A574" stroke-width="1.5"/>
    <rect x="585" y="55" width="175" height="22" rx="6" fill="#E8C87A"/>
    <rect x="585" y="71" width="175" height="6" fill="url(#srBaseGrad)"/>
    <text x="672" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5D4E37" text-anchor="middle" font-weight="700">SR-4</text>
    <text x="672" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5D4E37" text-anchor="middle" font-weight="600">Cryptographic Controls</text>
    <text x="672" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#7D6608" text-anchor="middle">& Data Protection</text>
    <text x="672" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8B6914" text-anchor="middle" font-style="italic">Encryptie, classificatie</text>
  </g>
  
