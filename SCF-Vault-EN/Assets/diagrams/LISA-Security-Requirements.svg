    <rect x="215" y="255" width="175" height="22" rx="6" fill="#E8C87A"/>
    <rect x="215" y="271" width="175" height="6" fill="url(#srBaseGrad)"/>
    <text x="302" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5D4E37" text-anchor="middle" font-weight="700">SR-10</text>
    <text x="302" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5D4E37" text-anchor="middle" font-weight="600">Continuous</text>
    <text x="302" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#7D6608" text-anchor="middle">Improvement</text>
    <text x="302" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8B6914" text-anchor="middle" font-style="italic">Vuln mgmt, pentesting</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="400" y="255" width="175" height="85" rx="6" fill="url(#srBaseGrad)" stroke="#D4A574" stroke-width="1.5"/>
    <rect x="400" y="255" width="175" height="22" rx="6" fill="#E8C87A"/>
    <rect x="400" y="271" width="175" height="6" fill="url(#srBaseGrad)"/>
    <text x="487" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5D4E37" text-anchor="middle" font-weight="700">SR-11</text>
    <text x="487" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5D4E37" text-anchor="middle" font-weight="600">Physical</text>
    <text x="487" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#7D6608" text-anchor="middle">& Environmental Security</text>
    <text x="487" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8B6914" text-anchor="middle" font-style="italic">Fysieke toegang</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="585" y="255" width="175" height="85" rx="6" fill="url(#srBaseGrad)" stroke="#D4A574" stroke-width="1.5"/>
    <rect x="585" y="255" width="175" height="22" rx="6" fill="#E8C87A"/>
    <rect x="585" y="271" width="175" height="6" fill="url(#srBaseGrad)"/>
    <text x="672" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5D4E37" text-anchor="middle" font-weight="700">SR-12</text>
    <text x="672" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5D4E37" text-anchor="middle" font-weight="600">Third-Party</text>
    <text x="672" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#7D6608" text-anchor="middle">Management</text>
    <text x="672" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8B6914" text-anchor="middle" font-style="italic">Leveranciersbeheer</text>
  </g>
  
  <!-- Row 4: SR-13 Privacy (special) -->
  <g filter="url(#shadow)">
    <rect x="215" y="360" width="360" height="85" rx="6" fill="url(#srPrivacyGrad)" stroke="#27AE60" stroke-width="2"/>
    <rect x="215" y="360" width="360" height="22" rx="6" fill="#82E0AA"/>
    <rect x="215" y="376" width="360" height="6" fill="url(#srPrivacyGrad)"/>
    <text x="395" y="377" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#145A32" text-anchor="middle" font-weight="700">SR-13</text>
    <text x="395" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#145A32" text-anchor="middle" font-weight="600">Privacy</text>
    <text x="395" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#196F3D" text-anchor="middle">AVG/GDPR Compliance</text>
    <text x="395" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#1E8449" text-anchor="middle" font-style="italic">FG, DPIA, Rechten betrokkenen, Consent, Datalekken</text>
  </g>
  
  <!-- AVG badge -->
  <rect x="540" y="368" width="30" height="16" rx="3" fill="#27AE60"/>
  <text x="555" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="600">AVG</text>
  
  <!-- Summary footer -->
  <rect x="30" y="465" width="730" height="45" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="395" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle" font-weight="600">13 Security Requirements → 180 Controls (153 CIS + 27 EXT-P)</text>
  <text x="395" y="502" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6c757d" text-anchor="middle">Elke SR is gekoppeld aan specifieke CIS Control categorieën en framework artikelen</text>
</svg>
