  <g filter="url(#shadow)">
    <rect x="30" y="155" width="175" height="85" rx="6" fill="url(#srBaseGrad)" stroke="#D4A574" stroke-width="1.5"/>
    <rect x="30" y="155" width="175" height="22" rx="6" fill="#E8C87A"/>
    <rect x="30" y="171" width="175" height="6" fill="url(#srBaseGrad)"/>
