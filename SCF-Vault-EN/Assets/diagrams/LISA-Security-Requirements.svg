    <rect x="30" y="255" width="175" height="85" rx="6" fill="url(#srBaseGrad)" stroke="#D4A574" stroke-width="1.5"/>
    <rect x="30" y="255" width="175" height="22" rx="6" fill="#E8C87A"/>
    <rect x="30" y="271" width="175" height="6" fill="url(#srBaseGrad)"/>
