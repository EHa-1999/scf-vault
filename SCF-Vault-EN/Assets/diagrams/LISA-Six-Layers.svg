<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#744210;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#975a16;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#276749;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2b6cb0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3182ce;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b2c2c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c53030;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#553c9a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b46c1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="bold" fill="#1a365d">LISA Framework - De Zes Lagen</text>
  <text x="400" y="50" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" fill="#718096">Layered Information Security Architecture</text>
  
  <!-- Layer 1: Governance Frameworks (y=70, h=65, ends at 135) -->
  <g filter="url(#shadow)">
    <rect x="50" y="70" width="700" height="65" rx="8" fill="url(#grad1)"/>
    <rect x="50" y="70" width="8" height="65" rx="4" fill="#e2e8f0"/>
    <text x="75" y="95" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#e2e8f0">LAAG 1</text>
    <text x="140" y="95" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="white">GOVERNANCE FRAMEWORKS</text>
    <text x="75" y="118" font-family="Segoe UI, Arial" font-size="11" fill="#bee3f8">NIST CSF · ISO 27001 · NIS2 · BIO2 · AVG</text>
    
    <!-- Framework icons -->
    <rect x="550" y="82" width="55" height="22" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="577" y="97" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="white">ISO</text>
    <rect x="615" y="82" width="55" height="22" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="642" y="97" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="white">NIS2</text>
    <rect x="680" y="82" width="55" height="22" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="707" y="97" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="white">BIO2</text>
  </g>
  
  <!-- Arrow 1→2 -->
  <path d="M400 135 L400 145 L390 145 L400 155 L410 145 L400 145" fill="#a0aec0"/>
  
  <!-- Layer 2: Security Requirements (y=160, h=65, ends at 225) -->
  <g filter="url(#shadow)">
    <rect x="50" y="160" width="700" height="65" rx="8" fill="url(#grad2)"/>
    <rect x="50" y="160" width="8" height="65" rx="4" fill="#feebc8"/>
    <text x="75" y="185" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#feebc8">LAAG 2</text>
    <text x="140" y="185" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="white">SECURITY REQUIREMENTS</text>
    <text x="75" y="208" font-family="Segoe UI, Arial" font-size="11" fill="#feebc8">13 kerngebieden: SR-1 t/m SR-13</text>
    
    <!-- SR badges -->
    <rect x="480" y="172" width="70" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="515" y="186" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="white">SR-1..SR-5</text>
    <rect x="560" y="172" width="70" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="595" y="186" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="white">SR-6..SR-9</text>
    <rect x="640" y="172" width="70" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="675" y="186" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="white">SR-10..SR-13</text>
  </g>
  
  <!-- Arrow 2→3 -->
  <path d="M400 225 L400 235 L390 235 L400 245 L410 235 L400 235" fill="#a0aec0"/>
  
  <!-- Layer 3: Controls (y=250, h=65, ends at 315) -->
  <g filter="url(#shadow)">
    <rect x="50" y="250" width="700" height="65" rx="8" fill="url(#grad3)"/>
    <rect x="50" y="250" width="8" height="65" rx="4" fill="#c6f6d5"/>
    <text x="75" y="275" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#c6f6d5">LAAG 3</text>
    <text x="140" y="275" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="white">CONTROLS</text>
    <text x="75" y="298" font-family="Segoe UI, Arial" font-size="11" fill="#c6f6d5">153 CIS Controls v8 + 27 Extended Privacy Controls</text>
    
    <!-- Control counts -->
    <rect x="520" y="262" width="90" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="565" y="276" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="white">93 Baseline</text>
    <rect x="620" y="262" width="90" height="20" rx="4" fill="rgba(255,255,255,0.25)"/>
    <text x="665" y="276" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="white">87 Optioneel</text>
  </g>
  
  <!-- Arrow 3→4 -->
  <path d="M400 315 L400 325 L390 325 L400 335 L410 325 L400 325" fill="#a0aec0"/>
  
  <!-- Layer 4: Implementations (y=340, h=65, ends at 405) -->
  <g filter="url(#shadow)">
    <rect x="50" y="340" width="700" height="65" rx="8" fill="url(#grad4)"/>
    <rect x="50" y="340" width="8" height="65" rx="4" fill="#bee3f8"/>
    <text x="75" y="365" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#bee3f8">LAAG 4</text>
    <text x="140" y="365" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="white">IMPLEMENTATIES</text>
    <text x="75" y="388" font-family="Segoe UI, Arial" font-size="11" fill="#bee3f8">Systems · Components · Implementations</text>
    
    <!-- Implementation icons -->
    <rect x="500" y="352" width="70" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="535" y="366" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="white">Systems</text>
    <rect x="580" y="352" width="70" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="615" y="366" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="white">Components</text>
    <rect x="660" y="352" width="50" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="685" y="366" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="white">IMPL</text>
  </g>
  
  <!-- Arrow 4→5 (NEW - was missing proper spacing) -->
  <path d="M400 405 L400 415 L390 415 L400 425 L410 415 L400 415" fill="#a0aec0"/>
  
  <!-- Layer 5: Evidence & Risks (y=430, h=55, ends at 485) - MOVED DOWN -->
  <g filter="url(#shadow)">
    <rect x="50" y="430" width="340" height="55" rx="8" fill="url(#grad5)"/>
    <rect x="50" y="430" width="8" height="55" rx="4" fill="#fed7d7"/>
    <text x="75" y="452" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#fed7d7">LAAG 5a</text>
    <text x="145" y="452" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="white">EVIDENCE</text>
    <text x="75" y="472" font-family="Segoe UI, Arial" font-size="10" fill="#fed7d7">Bewijsmateriaal · DoD · Verificatie</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="410" y="430" width="340" height="55" rx="8" fill="#c53030"/>
    <rect x="410" y="430" width="8" height="55" rx="4" fill="#feb2b2"/>
    <text x="435" y="452" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#feb2b2">LAAG 5b</text>
    <text x="505" y="452" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="white">RISICO'S</text>
    <text x="435" y="472" font-family="Segoe UI, Arial" font-size="10" fill="#feb2b2">Risk Register · Behandelplannen</text>
  </g>
  
  <!-- Arrow 5→6 -->
  <path d="M400 485 L400 495 L390 495 L400 505 L410 495 L400 495" fill="#a0aec0"/>
  
  <!-- Layer 6: Audits & Assurance (y=510, h=55, ends at 565) - MOVED DOWN -->
  <g filter="url(#shadow)">
    <rect x="50" y="510" width="700" height="55" rx="8" fill="url(#grad6)"/>
    <rect x="50" y="510" width="8" height="55" rx="4" fill="#e9d8fd"/>
    <text x="75" y="532" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#e9d8fd">LAAG 6</text>
    <text x="140" y="532" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="white">AUDITS &amp; ASSURANCE</text>
    <text x="75" y="552" font-family="Segoe UI, Arial" font-size="11" fill="#e9d8fd">Self-assessments · Interne audits · Bevindingen</text>
    
    <!-- Audit icons -->
    <rect x="540" y="522" width="80" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="580" y="536" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="white">Assessments</text>
    <rect x="630" y="522" width="80" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="670" y="536" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="white">Findings</text>
  </g>
  
  <!-- Side labels -->
  <text x="25" y="180" font-family="Segoe UI, Arial" font-size="9" fill="#718096" transform="rotate(-90 25,180)">Strategisch</text>
  <text x="25" y="480" font-family="Segoe UI, Arial" font-size="9" fill="#718096" transform="rotate(-90 25,480)">Operationeel</text>
  
  <!-- Connecting line on left -->
  <line x1="35" y1="100" x2="35" y2="550" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="35" cy="100" r="4" fill="#2c5282"/>
  <circle cx="35" cy="190" r="4" fill="#975a16"/>
  <circle cx="35" cy="280" r="4" fill="#38a169"/>
  <circle cx="35" cy="370" r="4" fill="#3182ce"/>
  <circle cx="35" cy="455" r="4" fill="#c53030"/>
  <circle cx="35" cy="535" r="4" fill="#6b46c1"/>
  
  <!-- Footer -->
  <text x="400" y="600" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#a0aec0">LISA Framework v3.0 · Layered Information Security Architecture</text>
</svg>
