<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="bold" fill="#1a365d">XENA DMS Architectuur</text>
  
  <!-- Internet/User -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="100" height="60" rx="6" fill="#f7fafc" stroke="#a0aec0" stroke-width="2"/>
    <text x="80" y="105" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="#4a5568">Gebruiker</text>
    <text x="80" y="120" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#718096">(Client)</text>
  </g>
  
  <!-- Arrow to NGINX -->
  <line x1="130" y1="110" x2="180" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="155" y="100" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#666">WebDAV</text>
  <text x="155" y="125" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#666">HTTPS</text>
  
  <!-- Main System Box -->
  <rect x="185" y="50" width="680" height="520" rx="10" fill="#f8fafc" stroke="#cbd5e0" stroke-width="2"/>
  <text x="525" y="75" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#2d3748">XENA Document Management System</text>
  
  <!-- DMZ Zone -->
  <rect x="195" y="85" width="660" height="70" rx="6" fill="#fed7d7" stroke="#fc8181" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="210" y="100" font-family="Segoe UI, Arial" font-size="9" font-weight="bold" fill="#c53030">DMZ</text>
  
  <!-- NGINX -->
  <g filter="url(#shadow)">
    <rect x="380" y="100" width="140" height="45" rx="6" fill="#48bb78" stroke="#276749" stroke-width="2"/>
    <text x="450" y="120" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">NGINX</text>
    <text x="450" y="135" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#c6f6d5">Reverse Proxy / TLS</text>
  </g>
  
  <!-- Application Zone -->
  <rect x="195" y="165" width="660" height="180" rx="6" fill="#ebf8ff" stroke="#90cdf4" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="210" y="180" font-family="Segoe UI, Arial" font-size="9" font-weight="bold" fill="#2b6cb0">APPLICATION ZONE</text>
  
  <!-- Arrow from NGINX -->
  <line x1="450" y1="145" x2="450" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Apache NiFi -->
  <g filter="url(#shadow)">
    <rect x="380" y="195" width="140" height="50" rx="6" fill="#4299e1" stroke="#2b6cb0" stroke-width="2"/>
    <text x="450" y="217" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">Apache NiFi</text>
    <text x="450" y="233" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#bee3f8">Orchestration</text>
  </g>
  
  <!-- KeyCloak -->
  <g filter="url(#shadow)">
    <rect x="210" y="195" width="130" height="50" rx="6" fill="#9f7aea" stroke="#6b46c1" stroke-width="2"/>
    <text x="275" y="217" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">KeyCloak</text>
    <text x="275" y="233" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#e9d8fd">IAM / SSO</text>
  </g>
  
  <!-- Saviynt -->
  <g filter="url(#shadow)">
    <rect x="560" y="195" width="130" height="50" rx="6" fill="#ed8936" stroke="#c05621" stroke-width="2"/>
    <text x="625" y="217" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">Saviynt</text>
    <text x="625" y="233" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#feebc8">IGA (SaaS)</text>
  </g>
  
  <!-- Elasticsearch -->
  <g filter="url(#shadow)">
    <rect x="710" y="195" width="130" height="50" rx="6" fill="#38b2ac" stroke="#285e61" stroke-width="2"/>
    <text x="775" y="217" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">Elasticsearch</text>
    <text x="775" y="233" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#b2f5ea">Search Engine</text>
  </g>
  
  <!-- OpenBAO -->
  <g filter="url(#shadow)">
    <rect x="310" y="275" width="280" height="50" rx="6" fill="#667eea" stroke="#5a67d8" stroke-width="2"/>
    <text x="450" y="297" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">OpenBAO</text>
    <text x="450" y="313" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#c3dafe">Secret Management</text>
  </g>
  
  <!-- Arrows to OpenBAO -->
  <line x1="275" y1="245" x2="320" y2="275" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="245" x2="450" y2="270" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="625" y1="245" x2="580" y2="275" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Data Zone -->
  <rect x="195" y="355" width="660" height="100" rx="6" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="210" y="370" font-family="Segoe UI, Arial" font-size="9" font-weight="bold" fill="#6b46c1">DATA ZONE</text>
  
  <!-- Arrows to Data Layer -->
  <line x1="380" y1="325" x2="300" y2="380" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="325" x2="450" y2="380" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="325" x2="600" y2="380" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- PostgreSQL -->
  <g filter="url(#shadow)">
    <rect x="210" y="385" width="130" height="55" rx="6" fill="#3182ce" stroke="#2c5282" stroke-width="2"/>
    <text x="275" y="408" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">PostgreSQL</text>
    <text x="275" y="425" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#bee3f8">Metadata DB</text>
  </g>
  
  <!-- MinIO -->
  <g filter="url(#shadow)">
    <rect x="380" y="385" width="140" height="55" rx="6" fill="#e53e3e" stroke="#c53030" stroke-width="2"/>
    <text x="450" y="408" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="bold" fill="white">MinIO</text>
    <text x="450" y="425" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#fed7d7">Object Storage</text>
  </g>
  
  <!-- Arrow NiFi to Elasticsearch -->
  <line x1="520" y1="220" x2="705" y2="220" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- External Integrations Box -->
  <rect x="195" y="470" width="660" height="90" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="210" y="485" font-family="Segoe UI, Arial" font-size="9" font-weight="bold" fill="#c05621">EXTERNE INTEGRATIES</text>
  
  <!-- External Systems -->
  <g filter="url(#shadow)">
    <rect x="220" y="500" width="120" height="45" rx="4" fill="#feebc8" stroke="#ed8936" stroke-width="1"/>
    <text x="280" y="520" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#744210">ZGW API's</text>
    <text x="280" y="535" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#975a16">OpenZaak, GZAC</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="360" y="500" width="120" height="45" rx="4" fill="#feebc8" stroke="#ed8936" stroke-width="1"/>
    <text x="420" y="520" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#744210">EntraID</text>
    <text x="420" y="535" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#975a16">SSO Federation</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="500" y="500" width="120" height="45" rx="4" fill="#feebc8" stroke="#ed8936" stroke-width="1"/>
    <text x="560" y="520" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="bold" fill="#744210">SMTP</text>
    <text x="560" y="535" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#975a16">Notificaties</text>
  </g>
  
  <!-- Arrows to External -->
  <line x1="450" y1="440" x2="280" y2="495" stroke="#666" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowhead)"/>
  <line x1="275" y1="245" x2="420" y2="495" stroke="#666" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="440" x2="560" y2="495" stroke="#666" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowhead)"/>
  
  <!-- Legend -->
  <rect x="640" y="500" width="200" height="45" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="650" y="515" font-family="Segoe UI, Arial" font-size="8" font-weight="bold" fill="#4a5568">Legenda:</text>
  <rect x="650" y="522" width="10" height="10" fill="#fed7d7" stroke="#fc8181"/>
  <text x="665" y="530" font-family="Segoe UI, Arial" font-size="7" fill="#666">DMZ</text>
  <rect x="700" y="522" width="10" height="10" fill="#ebf8ff" stroke="#90cdf4"/>
  <text x="715" y="530" font-family="Segoe UI, Arial" font-size="7" fill="#666">Application</text>
  <rect x="765" y="522" width="10" height="10" fill="#faf5ff" stroke="#d6bcfa"/>
  <text x="780" y="530" font-family="Segoe UI, Arial" font-size="7" fill="#666">Data</text>
  
  <!-- BIV Classification -->
  <rect x="700" y="85" width="140" height="55" rx="4" fill="white" stroke="#2d3748" stroke-width="1"/>
  <text x="770" y="100" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="bold" fill="#2d3748">BIV: BBN2</text>
  <text x="770" y="115" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#718096">B: Midden | I: Hoog</text>
  <text x="770" y="130" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#718096">V: Hoog</text>
</svg>